[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyctures"
version = "0.2.0"
description = "Python 2D and 3D graphics, drawn in your web browser. Games, animations, charts and 3D scenes."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "THIRD-PARTY-NOTICES"]
authors = [{ name = "John Wylie" }]
keywords = ["graphics", "canvas", "3d", "three.js", "games", "animation", "education", "pyodide"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
    "Topic :: Education",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7", "playwright>=1.40"]

[project.urls]
Homepage = "https://www.circuitry.dev/pyctures"
Documentation = "https://github.com/johnwylie70/pyctures/tree/main/docs"
Source = "https://github.com/johnwylie70/pyctures"
Issues = "https://github.com/johnwylie70/pyctures/issues"
Changelog = "https://github.com/johnwylie70/pyctures/blob/main/CHANGELOG.md"

[project.scripts]
pyctures = "pyctures.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyctures = ["web/*.js", "web/three/*", "web/synths/*", "web/dials/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
